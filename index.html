// refresh() vẽ lại nội dung nên nút "chơi lại" cần giữ trạng thái xác nhận: bỏ qua refresh một lần
const _refresh = UI.refresh.bind(UI);
UI.refresh = function () { if (this._panel && this._panel._keep) { this._panel._keep = false; return; } _refresh(); };

/* ============================================================
 *  MENU CHUNG (Esc hoặc M): một bảng duy nhất, các tab là icon
 *  Chỉ số · Bạn bè · Thời khoá biểu · Học bạ · Lịch · Thẻ cầu thủ · Cài đặt
 * ============================================================ */
const MENU_TABS = [['stats', 'Chỉ số'], ['friends', 'Bạn bè'], ['tt', 'Thời khoá biểu'], ['grades', 'Học bạ'], ['cal', 'Lịch'], ['cards', 'Thẻ cầu thủ'], ['set', 'Cài đặt']];
const MV = {};
const subTabs = (act, cur, list) => '<div class="tabs">' + list.map(([id, name]) => `<button class="tab ${cur === id ? 'on' : ''}" data-act="${act}" data-id="${id}">${name}</button>`).join('') + '</div>';
const heartsHtml = n => `<span class="hearts">${'♥'.repeat(n)}<i>${'♥'.repeat(5 - n)}</i></span>`;
UI.menu = function (tab) {
  if (tab && MV[tab]) { this._tab = tab; if (MV[tab].init) MV[tab].init(); }
  if (!this._tab) { this._tab = 'stats'; }
  const H = { tab: d => { UI._tab = d.id; if (MV[d.id].init) MV[d.id].init(); } };
  for (const k in MV) Object.assign(H, MV[k].h || {});
  const name = () => MENU_TABS.find(x => x[0] === UI._tab)[1];
  this.panel('', () => {
    $('m-title').textContent = name();
    return `<div class="mtabs">${MENU_TABS.map(([id, nm]) => `<button class="mtab ${id === UI._tab ? 'on' : ''}" data-act="tab" data-id="${id}" title="${nm}"><img src="${itemIcon('m_' + id)}" alt="${nm}"></button>`).join('')}</div>` + MV[UI._tab].render();
  }, H, true);
  $('m-title').textContent = name();
};

/* ---------- Chỉ số: Lý thuyết · Thực hành · Khác ---------- */
MV.stats = {
  h: { stab: d => { UI._stab = d.id; } },
  render() {
    const st = UI._stab || 'ly';
    const bar = (cur, need, col) => `<div class="pb"><div style="width:${need ? Math.round(100 * cur / need) : 100}%;background:${col || ''}"></div></div>`;
    const cell = k => { const i = lvlInfo(G.stats[k]), col = SUBJ[k] ? SUBJ[k].color : ({ thethao: '#d9742b', buonban: '#c9862b', giaotiep: '#e06a9a', kheotay: '#3f8f9b', vannghe: '#9a72d6' })[k]; return `<div class="st"><div class="sth"><b>${STAT_NAMES[k]}</b><span class="lv">Lv ${i.lv}</span></div>${bar(i.cur, i.need, col)}<small>${i.lv >= 10 ? 'Tối đa' : `${i.cur}/${i.need}`}</small></div>`; };
    const big = (name, v, note) => `<div class="st big"><div class="sth"><b>${name}</b><span class="lv">${fmtAvg(v)}</span></div><small>${note}</small></div>`;
    let h = subTabs('stab', st, [['ly', 'Lý thuyết'], ['th', 'Thực hành'], ['khac', 'Khác']]);

    else if (st === 'th') h += big('Thực hành', thucHanh(), 'Trung bình cấp Quốc phòng và thực hành Lý, Hoá, Sinh') + '<div class="sgrid">' + PRACTICE.map(cell).join('') + '</div>';
    else h += '<div class="sgrid">' + ['thethao', 'buonban', 'giaotiep', 'kheotay', 'vannghe'].map(cell).join('') + '</div>';

MV.grades = {

/* ---------- Lịch (kiểu Stardew Valley) — kiêm bảng chọn ngày khi du hành thời gian ---------- */
MV.cal = {
  init() { const c = today(); UI._calS = c.season; UI._calY = c.year; },
  h: {
    prev: () => { if (--UI._calS < 0) { if (UI._calY > 0) { UI._calS = SEASONS.length - 1; UI._calY--; } else UI._calS = 0; } },
    next: () => { if (++UI._calS >= SEASONS.length) { UI._calS = 0; UI._calY++; } },
    now: () => MV.cal.init(),
    jump: d => { const day = +d.id; UI._travel = false; UI.close(-1); timeTravelAsk(day); },
    notravel: () => { UI._travel = false; },
  },
  render() {
    if (UI._calS === undefined) MV.cal.init();
    const yr = UI._calY, se = UI._calS, base = yr * YEAR_DAYS + se * CFG.DAYS_PER_SEASON, tests = {}, tv = !!UI._travel;
    for (const t of G.tests) (tests[t.day] = tests[t.day] || []).push(t);
    let h = tv ? '<p class="warnbox">Du hành thời gian: bấm vào một ngày bất kỳ để nhảy tới ngày đó. <button class="btn sm ghost" data-act="notravel">Thôi</button></p>' : '';
    h += `<div class="calhead"><button class="btn sm" data-act="prev">‹</button><b>Mùa ${SEASONS[se].name} · Năm ${yr + 1}</b><button class="btn sm" data-act="next">›</button><button class="btn sm ghost" data-act="now">Hôm nay</button><span class="dim">${dateLabel(G.day)}</span></div><div class="cal">`;
    h += DOW.map((d, i) => `<div class="cd h ${i >= 5 ? 'we' : ''}">${d}</div>`).join('');
    for (let i = 0; i < cal(base).dow; i++) h += '<div class="cd x"></div>';
    for (let d = 0; d < CFG.DAYS_PER_SEASON; d++) {
      const day = base + d, c = cal(day), ev = [], hol = holidayOf(day), sem = semOf(day);
      if (sem && c.doy === sem.from) ev.push(`<span class="ev sem">Bắt đầu ${sem.name}</span>`);
      if (sem && c.doy === sem.to) ev.push(`<span class="ev sem">Tổng kết ${sem.name}</span>`);
      if (hol) ev.push(`<span class="ev hol">${hol.name}</span>`);
      for (const f of FESTIVALS) if (f.season === se && f.day === d + 1) ev.push(`<span class="ev fes">${f.name}</span>`);
      for (const f in FRIENDS) if (isDate(FRIENDS[f].bday, day)) ev.push(`<span class="ev bd">Sinh nhật ${FRIENDS[f].name}</span>`);
      for (const w in PARENT_BDAY) if (isDate(PARENT_BDAY[w], day)) ev.push(`<span class="ev bd">Sinh nhật ${PNAME[w].toLowerCase()}</span>`);
      for (const t of tests[day] || []) ev.push(`<span class="ev ts ${t.done ? 'done' : ''}" style="--c:${SUBJ[t.subj].color}" title="${TEST_NAME[t.type]} · ${SUBJ[t.subj].name}">${SUBJ[t.subj].short} · ${t.type === 'thi' ? 'thi' : '1 tiết'}</span>`);
      if (G.meet && G.meet.day === day) ev.push(`<span class="ev mt">Hẹn ${FRIENDS[G.meet.fid].name}</span>`);
      const off = c.dow >= 5 || !SEASONS[se].school || hol;
      h += `<div class="cd ${day === G.day ? 'today' : ''} ${day < G.day ? 'past' : ''} ${off ? 'we' : ''} ${tv ? 'pick' : ''}" ${tv ? `data-act="jump" data-id="${day}"` : ''}><b>${d + 1}</b>${ev.join('')}</div>`;
    }
    h += '</div><div class="callegend"><span class="ev ts" style="--c:#7a7085">Kiểm tra 1 tiết / thi</span><span class="ev bd">Sinh nhật</span><span class="ev hol">Ngày lễ</span><span class="ev fes">Lễ hội</span><span class="ev mt">Cuộc hẹn</span><span class="ev sem">Học kỳ</span></div>';
    return h + `<p class="dim">${SEASONS[se].school ? 'Ô màu nhạt là ngày nghỉ (thứ 7, chủ nhật, ngày lễ).' : 'Nghỉ hè — không có tiết học.'} Lịch kiểm tra của một học kỳ được xếp vào ngày đầu học kỳ đó.${FESTIVALS.length ? '' : ' Lễ hội sẽ được bổ sung sau.'}</p>`;
  },
};

// Mã thử nghiệm: +thiện cảm với mọi nhân vật
function cheatLove() {

  list.sort((p, q) => p.b - q.b);
  for (const e of list) {
    if (e.o) drawSpr(e.o.dyn ? SPR[e.o.dyn()] : SPR[e.o.s], e.o.x, e.o.y);
    else if (e.n && e.n.fam && FAM[e.n.fam].riding) {   // bố mẹ đang chạy xe
      const n = e.n, left = n.cdir === 1, b = SPR[BIKE[n.fam].spr + (left ? 'L' : '')];
      drawSpr(SHADOW, n.cx - 7, n.cy - 3); drawSpr(b, n.cx - 16, n.cy - 21);
      drawSpr(charSheet(n.look, n.outfit ? n.outfit() : null)[left ? 1 : 2][0], n.cx - 9 + (left ? 2 : -2), n.cy - 32);
    }
    else if (e.n) drawChar(e.n.dynLook ? e.n.dynLook() : e.n.look, e.n.outfit ? e.n.outfit() : null, e.n.cx, e.n.cy, e.n.cdir, e.n.walk, e.n.coy);
    else if (e.a) { if (!e.a.hidden) drawChar(e.a.look, e.a.outfit, e.a.x, e.a.y, e.a.dir, e.a.walk === undefined ? -1 : e.a.walk, e.a.oy); }
    else if (e.v) drawSpr(SPR[VEHICLES[e.v.id].spr], e.v.x - 15, e.v.y - 19);
    else if (e.f) drawChar(G.comp.fid, friendOutfit(G.comp.fid), e.f.x, e.f.y, e.f.dir, e.f.walk);
    else if (G.ride && !RT.scene) drawRider(G.gender, RT.outfit || (schoolToday() ? null : 'casual'), VEHICLES[G.ride].spr, G.x, G.y, !!RT.faceL, G.comp ? G.comp.fid : null);
    else drawChar(G.gender, RT.outfit || (schoolToday() ? null : 'casual'), G.x, G.y, G.dir, RT.walkT, RT.scene && RT.scene.meOy);
  }
  // đạo cụ của đoạn cắt cảnh (yoyo, con quay, bài, gương soi…) vẽ đè lên nhân vật
  if (G && RT.scene && RT.scene.props && G.map === RT.scene.map) for (const p of RT.scene.props) p(now);
  if (G && !RT.scene) drawYardProps(now);        // bài, con quay, bóng, cầu… của các tụ chơi ngoài sân
  // biển hiệu (chữ nét)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of m.labels) { ctx.font = `800 ${l.size * S}px "Baloo 2", system-ui, sans-serif`; ctx.fillStyle = l.col; ctx.fillText(l.text, VIEW.ox + l.x * S, VIEW.oy + l.y * S, l.maxw * S); }
  // sáng / tối theo giờ
  if (G) { const a = nightAlpha(G.time) * (m.indoor ? 0.4 : 1); if (a > 0.01) { ctx.fillStyle = `rgba(22,20,74,${a})`; ctx.fillRect(0, 0, cv.width, cv.height); } }
  // quầng sáng đèn đường ban đêm
  if (G && !m.indoor) { const a = nightAlpha(G.time); if (a > 0.05) { ctx.globalCompositeOperation = 'lighter'; for (const o of m.objs) { if (o.s !== 'lamp') continue; const X = VIEW.ox + (o.x + 6) * S, Y = VIEW.oy + (o.y + 8) * S, g = ctx.createRadialGradient(X, Y, 0, X, Y, 52 * S); g.addColorStop(0, `rgba(255,214,130,${0.55 * a * 2})`); g.addColorStop(1, 'rgba(255,214,130,0)'); ctx.fillStyle = g; ctx.fillRect(X - 52 * S, Y - 52 * S, 104 * S, 104 * S); } ctx.globalCompositeOperation = 'source-over'; } }
  // cắt cảnh: hai dải đen kiểu phim + tên cảnh + bong bóng thoại
  if (G && RT.scene && RT.scene.type === 'cut') {
    const bh = RT.scene.bars === false ? 0 : Math.round(cv.height * 0.085);
    if (bh) { ctx.fillStyle = '#15121f'; ctx.fillRect(0, 0, cv.width, bh); ctx.fillRect(0, cv.height - bh, cv.width, bh); }
    if (bh && RT.scene.title) { ctx.font = `700 ${Math.max(12, Math.round(bh * 0.36))}px "Baloo 2", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff6e3'; ctx.fillText(RT.scene.title, cv.width / 2, cv.height - bh / 2); }
    if (RT.scene.bubble) drawBubble(RT.scene.bubble);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  }
  if (G && !RT.lock && !UI.isOpen()) {
    const t = RT.hover || RT.near;
    if (t && inRange(t)) drawSpr(SPR.marker, t.x + t.w / 2 - 5, t.y - 10 + Math.round(Math.sin(now / 160) * 1.5));
  }
  // chữ bay (+5 Toán, +3.000đ…)
  for (const f of RT.floats) {
    if (f.t < 0) continue;
    const a = f.t > 1.1 ? Math.max(0, 1 - (f.t - 1.1) / 0.5) : 1;
    ctx.globalAlpha = a; ctx.font = `800 ${7 * S}px "Baloo 2", system-ui, sans-serif`;
    const X = VIEW.ox + f.x * S, Y = VIEW.oy + (f.y - f.t * 16) * S;
    ctx.lineWidth = Math.max(3, S * 1.2); ctx.lineJoin = 'round'; ctx.strokeStyle = '#2a2136'; ctx.strokeText(f.text, X, Y);
    ctx.fillStyle = f.col; ctx.fillText(f.text, X, Y); ctx.globalAlpha = 1;
  }
  if (JOY.id !== null) {
    const d = VIEW.dpr; ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff6e3'; ctx.beginPath(); ctx.arc(JOY.sx * d, JOY.sy * d, 46 * d, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 0.7; ctx.beginPath(); const l = Math.hypot(JOY.dx, JOY.dy), k = l > 40 ? 40 / l : 1; ctx.arc((JOY.sx + JOY.dx * k) * d, (JOY.sy + JOY.dy * k) * d, 20 * d, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1;
  }
}
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  update(dt); render(t);
  requestAnimationFrame(frame);
}

/* ---------- điều khiển ---------- */
function bindInput() {
  window.addEventListener('keydown', e => {
    if (!G) return;
    if (UI.isOpen()) return UI._key(e);
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const k = e.key.toLowerCase(); KEYS[k] = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (e.repeat) return;
    if (k === 'q') turnToFriend();                  // trong giờ học: quay sang bạn
    if (k === 'e' || k === ' ' || k === 'enter') { scanTargets(); doInteract(RT.near || RT.hover); }
    else if (k === 'b') openMenu('bag'); else if (k === 'c') openMenu('stats'); else if (k === 'f') openMenu('friends'); else if (k === 't') openMenu('tt'); else if (k === 'g') openMenu('grades'); else if (k === 'k') openMenu('cards');
    else if (k === 'p') openMenu('phone'); else if (k === 'l') openMenu('cal'); else if (k === 'x') { if (G.ride && !RT.lock) dismount(); } else if (k === 'escape' || k === 'm') openMenu('menu');
  });
  window.addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
  window.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('mousemove', e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY; MOUSE.on = true; });
  cv.addEventListener('mouseleave', () => { MOUSE.on = false; });
  cv.addEventListener('mousedown', e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY; MOUSE.on = true; if (e.button === 2 || e.button === 0) { e.preventDefault(); interactPointer(); } });
  // cảm ứng: nửa trái là cần điều khiển, chạm vào đồ vật để tương tác
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (JOY.id === null && t.clientX < window.innerWidth * 0.42) { JOY.id = t.identifier; JOY.sx = t.clientX; JOY.sy = t.clientY; JOY.dx = JOY.dy = 0; }
      else { MOUSE.x = t.clientX; MOUSE.y = t.clientY; MOUSE.on = true; interactPointer(); MOUSE.on = false; }
    }
  }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === JOY.id) { JOY.dx = t.clientX - JOY.sx; JOY.dy = t.clientY - JOY.sy; } }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === JOY.id) { JOY.id = null; JOY.dx = JOY.dy = 0; } };
  cv.addEventListener('touchend', end); cv.addEventListener('touchcancel', end);
  window.addEventListener('resize', resize);
}

/* ---------- màn hình mở đầu ---------- */
function drawPreview(id, look) {
  const c = $(id), x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, c.width, c.height);
  x.drawImage(charSheet(look)[0][0], 0, 0, 18, 24, 3, 0, 72, 96);
}
function startGame(isNew) {
  if (isNew) newGame($('t-name').value.trim().slice(0, 16), TITLE.gender);
  $('title').classList.add('off'); document.body.classList.add('playing');
  UI.hud();
  if (isNew) {
    UI.ask('Ngày đầu tiên vào lớp 10', `<p>Chào <b>${G.name}</b>! Hôm nay là ${dateLabel(G.day)} — buổi học đầu tiên ở Trường THPT Hoa Phượng.</p>
      <ul class="res"><li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> để di chuyển, <kbd>Chuột phải</kbd> vào đồ vật để tương tác.</li>
<li>Buổi sáng: ăn sáng trong bếp, <b>soạn sách ở bàn học</b> theo thời khoá biểu, rồi đến trường <b>trước 08:00</b>.</li>
      <li>Thành phố: <b>nhà mình</b> bên trái — <b>phố Hoa Phượng</b> ở giữa — <b>trường</b> bên phải. Đi bộ dọc đường sang phải (khoảng 1 tiếng), hoặc ra <b>trạm xe bus</b> bấm vào xe để lên xe rồi chọn điểm đến. Có xe đạp thì bấm vào xe ở sân nhà để đi (<kbd>X</kbd> để xuống xe).</li>
      <li>Bố mẹ đi làm lúc 07:30 — muốn nhờ chở phải hỏi trước 07:20. Đến nơi nhớ <b>đi qua cổng trường</b> để vào lớp.</li>
      <li>Trò chuyện, đấm lưng, phụ việc nhà để bố mẹ vui. Ngày đi học nhớ về nhà trước 20:00 (hoặc xin phép); thứ 7, chủ nhật thì thoải mái.</li>
      <li>Phố Hoa Phượng có trà sữa, TTTM, khu game; đi xuống là <b>bờ sông</b> (câu cá), đi lên là <b>ga tàu</b> ra biển. <b>Núi</b> ở sau trường: theo lối mòn bên phải cổng trường.</li>
      <li>Trong lớp cứ để yên là chăm chú nghe giảng; muốn quay sang bạn thì bấm <kbd>Q</kbd> lúc thầy cô đang giảng. Giờ ra chơi, bấm vào bạn để nói chuyện hoặc rủ trốn học.</li>
      <li><kbd>Esc</kbd> hoặc <kbd>M</kbd> mở menu (chỉ số, bạn bè, thời khoá biểu, học bạ, lịch, thẻ, cài đặt) · <kbd>B</kbd> túi đồ · <kbd>P</kbd> điện thoại. Game tự lưu mỗi khi bạn đi ngủ.</li></ul>`, ['Bắt đầu']).then(() => morningBrief());
  } else morningBrief();
}
const TITLE = { gender: 'boy' };
function initTitle() {
  drawPreview('pv-boy', 'boy'); drawPreview('pv-girl', 'girl');
  const sel = g => { TITLE.gender = g; $('g-boy').classList.toggle('on', g === 'boy'); $('g-girl').classList.toggle('on', g === 'girl'); };
  $('g-boy').addEventListener('click', () => sel('boy')); $('g-girl').addEventListener('click', () => sel('girl'));
  $('t-start').addEventListener('click', () => startGame(true));
  const cont = $('t-cont');
  if (hasSave()) { $('t-warn').style.display = ''; cont.style.display = ''; cont.addEventListener('click', () => { if (load()) startGame(false); else UI.toast('Không đọc được bản lưu.', 'bad'); }); }
  $('t-name').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(true); });
}

function boot() {
  cv = $('cv'); ctx = cv.getContext('2d');
  buildSprites(); buildSprites2(); buildMaps();
  resize(); bindInput(); bindUI(); initTitle();
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
